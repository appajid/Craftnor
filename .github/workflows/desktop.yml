name: Craftnor desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac dmg --arm64
            artifact: macos-arm64
          - os: macos-14
            target: --mac dmg --x64
            artifact: macos-x64
          - os: windows-2022
            target: --win nsis --x64
            artifact: windows-x64
          - os: windows-2022
            target: --win nsis --arm64
            artifact: windows-arm64
          - os: ubuntu-22.04
            target: --linux tar.gz --x64
            artifact: linux-x64
          - os: ubuntu-22.04
            target: --linux tar.gz --arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run desktop:test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Craftnor-${{ matrix.artifact }}
          path: |
            ../desktop-builds/*.dmg
            ../desktop-builds/*.exe
            ../desktop-builds/*.AppImage
            ../desktop-builds/*.tar.gz
          if-no-files-found: error
